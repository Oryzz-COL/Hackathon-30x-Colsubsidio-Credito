name: Proponer una mejora
description: Sugiere una mejora de producto, documentación o ingeniería.
title: "[Mejora]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: ¿Qué necesidad concreta no está resuelta?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Propuesta
      description: Describe el resultado deseado, no solo una implementación.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia o criterio de éxito
      description: ¿Cómo sabremos que la mejora funciona sin introducir afirmaciones no verificadas?
  - type: checkboxes
    id: principles
    attributes:
      label: Principios
      options:
        - label: La propuesta conserva consentimiento, explicabilidad y revisión humana.
          required: true
        - label: La propuesta no requiere datos personales reales para demostrarse.
          required: true
